
<!DOCTYPE html>
<html>

<head>
    <!-- TASK 1: Add the page title -->
    <title>Sound Identification Web App</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>

    <!-- ml5.js library -->
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <!-- TASK 2: Link your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TASK 3: Create the header section -->
    <div class="col-xs-12 header_div text-center">

        <h2>Sound controlled Aliens</h2>

        <p>Note: Play different sounds like clap,snap, bell to make the aliens dance</p>

    </div>

    <!-- Main application area -->
    <div class="main_div">

        <center>

            <br>

            <!-- TASK 4: Create a START button.
                 It should call startClassification(). -->
                 <button class="btn btn-warning" onclick="startClassification()">START</button>


            <!-- TASK 5: Add a heading to display the detected sound.
                 Give it the ID: result_label -->
                 <h3 id="result_label">I can hear - </h3>


            <!-- TASK 6: Add a heading to display confidence.
                 Give it the ID: result_confidence -->
                 <h4 id="result_confidence">Accuracy - </h4>


            <br>

            <!-- TASK 7: Add four alien images.
                 Use these IDs:
                 alien1, alien2, alien3, alien4

                 Image files:
                 aliens-01.png
                 aliens-02.png
                 aliens-03.png
                 aliens-04.png

                 Set width and height to 300. -->
                 <img src="aliens-01.png" id="alien1" width="300" height="300">
                 <img src="aliens-02.png" id="alien2" width="300" height="300">
                 <img src="aliens-03.png" id="alien3" width="300" height="300">
                 <img src="aliens-04.png" id="alien4" width="300" height="300">

        </center>

    </div>

    <!-- Footer -->
    <div class="copy_right_footer">
        Developed by - Alien Team of Specialists
    </div>

    <!-- TASK 8: Link your JavaScript file -->
    <script src="main.js"></script>

</body>
</html>
